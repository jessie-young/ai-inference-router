name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      # The suite runs fully offline: no API key or network access required.
      - run: npm test
      # End-to-end verifiers over real sockets, also fully offline.
      - run: node demo/verify-streaming.mjs --self
      - run: node demo/verify-fallback.mjs
